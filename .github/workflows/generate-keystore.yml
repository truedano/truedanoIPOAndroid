name: One-time Keystore Generator

# 僅供第一次沒有本機 Java 環境時，手動在 GitHub Actions 產生正式金鑰
on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore 密碼 (請務必記牢)'
        required: true
        default: 'truedano@pass2026'
      key_alias:
        description: 'Key 別名'
        required: true
        default: 'truedano-key'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.store_password }}" \
            -dname "CN=truedano, OU=Android, O=truedano, L=Taipei, ST=Taiwan, C=TW"

          # 轉為 Base64
          base64 -w 0 my-upload-key.jks > keystore_base64.txt

      - name: Upload Keystore Artifact (請下載備份至私人硬碟)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: my-upload-key.jks
          retention-days: 7

      - name: Output Base64 for GitHub Secrets
        run: |
          echo "================================================================="
          echo "請複製下方的 Base64 字串，填入 GitHub Secrets 的 RELEASE_KEYSTORE_BASE64："
          echo "================================================================="
          cat keystore_base64.txt
          echo ""
          echo "================================================================="
